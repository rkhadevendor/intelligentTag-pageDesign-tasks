<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Manual Entry</title>
  <link rel="stylesheet" href="calculator.css" />
</head>
<body>
  <div class="screen">
    <div class="nav">PatT - Partial Comp Pay - Tip Manual Entry</div>

    <div class="modal">
      <div class="header">Enter the amount to tip</div>
      <div class="display">-</div>

      <div class="main-keyboard">
        <div class="keyboard">
          <div class="row">
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
          </div>
          <div class="row">
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
          </div>
          <div class="row">
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
          </div>
          <div class="row">
            <div class="key small">•</div>
            <div class="key">0</div>
            <div class="key small2">&#9003;</div>
          </div>
        </div>
      </div>

      <div class="done"><a href="#" title="Done">Done</a></div>
    </div>
  </div>
</body>
</html>
