<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day One Task</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="firstTask.css" />
</head>
<body>
    <!-- Navbar -->
    <nav>
      <div class="back-btn" title="Back"><i class="fa-solid fa-angle-left"></i></div>
      <div class="nav-text">PatT - Fully Paid - Tip</div>
    </nav>

    <!-- Main Content -->
    <div class="main">
      <div class="container1">
        <div class="subtotal">Check Subtotal: $XX.XX</div>
        <div class="tip">Tip is based on the full check before comps or discounts</div>
      </div>

      <div class="container2">
        <div class="amount-text">Choose the amount to tip</div>
        <div class="amount">
          <div class="small1">$20.00</div>
        </div>
      </div>

      <div class="container3">
        <div class="percentage">
          <div class="big">15%</div>
          <div class="small">$15.00</div>
        </div>
        <div class="percentage">
          <div class="big">20%</div>
          <div class="small">$20.00</div>
        </div>
        <div class="percentage">
          <div class="big">25%</div>
          <div class="small">$25.00</div>
        </div>
        <div class="percentage">
          <div class="big">OTHER</div>
        </div>
      </div>

      <div class="container4">
        <div class="tip">
          <div class="big">TIP $20.00</div>
        </div>
        <div class="dic">[if tip amount is $0 button label should be "NO TIP"]</div>
      </div>
    </div>

    <!--Footer -->
    <div class="footer">
      <div class="left-icon">
        <div class="calculator" title="calculator"><i class="fa-solid fa-calculator"></i></div>
        <div><button>Reset</button></div>
      </div>
      <div class="right">
        <div class="info">(Full Comps applied)</div>
        <div class="text" title="Text"><i class="fa-regular fa-file-lines"></i></div>
      </div>
    </div>
</body>
</html>
